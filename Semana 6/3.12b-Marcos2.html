<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marco 2</title>
</head>
<body>
    <form>
        <input type="button" value="Cambiar Color" onclick="
            var campoColor = parent.Marco1.document.form1.color;
            var colorin = (campoColor.selectedIndex == 0) ? 'green' : 'blue';
            
            var campoFrame = parent.Marco1.document.form1.marcos;
            if (campoFrame.selectedIndex == 0) {
                parent.Marco1.document.body.style.backgroundColor = colorin;
            } else {
                parent.Marco2.document.body.style.backgroundColor = colorin;
            }
        ">
    </form>
</body>
</html>
