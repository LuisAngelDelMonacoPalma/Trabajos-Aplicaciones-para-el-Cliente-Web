<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detección de Sistema Operativo</title>
</head>
<body>
    <script>
        var SO = navigator.userAgentData ? navigator.userAgentData.platform : navigator.platform;
        document.write("<h1>Documento abierto con: " + SO + "</h1>");
    </script>
</body>
</html>
