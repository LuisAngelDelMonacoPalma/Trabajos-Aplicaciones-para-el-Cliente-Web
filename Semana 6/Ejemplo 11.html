<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de Campo Vacío</title>
    <script>
        function validacion() {
            var valor = document.getElementById("campo").value;
            if (valor == null || valor.length == 0) {
                alert("El campo no puede ser vacío");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <form onsubmit="return validacion()">
        <label for="campo">Texto:</label>
        <input type="text" id="campo" name="campo">
        <input type="submit" value="Validar">
    </form>
</body>
</html>
