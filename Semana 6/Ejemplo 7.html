<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Arreglo de Productos</title>
</head>
<body>
    <h1>Generación de Arreglo de Códigos</h1>
    <p>Revisa la consola del navegador (F12) para ver los elementos generados.</p>
    <script>
        var codigos_productos = new Array();
        for (var i = 0; i < 10; i++) {
            codigos_productos[i] = "Codigo_producto_" + i;
        }
        
        // Imprimir en consola para verificar
        console.log(codigos_productos);
    </script>
</body>
</html>
