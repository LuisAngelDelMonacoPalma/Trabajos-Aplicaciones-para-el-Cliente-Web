<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fffaf5;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(230, 81, 0, 0.12);
            border-top: 6px solid #f57c00;
        }

        h2 {
            text-align: center;
            color: #e65100;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #424242;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ffe0b2;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: #f57c00;
            box-shadow: 0 0 5px rgba(245, 124, 0, 0.3);
        }

        button {
            width: 100%;
            background-color: #f57c00;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e65100;
        }

        .results {
            margin-top: 25px;
            display: none;
        }

        .results h3 {
            color: #e65100;
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 2px solid #ffe0b2;
            padding-bottom: 6px;
        }

        .item-resultado {
            background-color: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .item-resultado strong {
            color: #e65100;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Calculadora</h2>

        <form id="calcForm">
            <div class="form-group">
                <label for="num1">Primer Número:</label>
                <input type="number" id="num1" step="any" required placeholder="Ingrese el primer número">
            </div>

            <div class="form-group">
                <label for="num2">Segundo Número:</label>
                <input type="number" id="num2" step="any" required placeholder="Ingrese el segundo número">
            </div>

            <button type="submit">Calcular Resultados</button>
        </form>

        <div id="resultsContainer" class="results">
            <h3>Resultados:</h3>
            <div id="resultsList"></div>
        </div>
    </div>
    <script>
        document.getElementById("calcForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const n1 = parseFloat(document.getElementById("num1").value);
            const n2 = parseFloat(document.getElementById("num2").value);
            const resultsList = document.getElementById("resultsList");
            
            resultsList.innerHTML = "";

            for (let i = 1; i <= 5; i++) {
                let operacion = "";
                let resultado;

                switch (i) {
                    case 1:
                        operacion = "Suma";
                        resultado = `${n1} + ${n2} = ${n1 + n2}`;
                        break;
                    case 2:
                        operacion = "Resta";
                        resultado = `${n1} - ${n2} = ${n1 - n2}`;
                        break;
                    case 3:
                        operacion = "Multiplicación";
                        resultado = `${n1} × ${n2} = ${n1 * n2}`;
                        break;
                    case 4:
                        operacion = "División";
                        resultado = (n2 !== 0) 
                            ? `${n1} ÷ ${n2} = ${n1 / n2}` 
                            : "No es posible dividir para cero";
                        break;
                    case 5:
                        operacion = "Módulo %";
                        resultado = (n2 !== 0) 
                            ? `${n1} % ${n2} = ${n1 % n2}` 
                            : "No es posible calcular el módulo con divisor cero";
                        break;
                }

                const item = document.createElement("div");
                item.className = "item-resultado";
                item.innerHTML = `<strong>${operacion}:</strong> ${resultado}`;
                resultsList.appendChild(item);
            }

            document.getElementById("resultsContainer").style.display = "block";
        });
    </script>
</body>
</html>
